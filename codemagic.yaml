# Codemagic: compila o app do iPhone e manda para o TestFlight. Só roda quando alguém clica em
# "Start new build" (sem gatilho automático). A chave da App Store Connect fica no Codemagic, em
# Integrations → Developer Portal, com o nome "soneca.asc"; nada de segredo neste arquivo.
workflows:
  ios-testflight:
    name: Soneca iPhone (TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: soneca.asc
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: br.app.soneca
      vars:
        APP_STORE_APPLE_ID: 6821448149
      node: 22
      xcode: latest
    scripts:
      - name: Instalar dependências
        script: npm ci
      - name: Montar o site e atualizar o projeto do iPhone
        # Copia o site para www/ e roda o cap sync (que também tira o Facebook do plugin de login)
        script: npm run ios
      - name: Assinatura (certificado e perfil gerados pelo Codemagic)
        script: xcode-project use-profiles
      - name: Compilar
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "App" \
            --archive-xcargs "CURRENT_PROJECT_VERSION=$((LATEST + 1))"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Só envia: o teste interno (você e a família) não passa por revisão da Apple. O teste externo
        # (gente de fora, com link público) pede a revisão beta e as informações de teste preenchidas.
        submit_to_testflight: false

  # App do Android: compila o pacote (.aab) assinado com a chave de envio "soneca_upload_2" (Personal Account →
  # Code signing identities → Android keystores). Também só ao clicar em "Start new build".
  # O primeiro envio à Play Store é à mão (baixar o .aab dos artefatos e subir no Play Console); depois
  # dele, dá para o Codemagic enviar sozinho para o teste fechado.
  android-play:
    name: Soneca Android (Play Store)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      android_signing:
        - soneca_upload_2
      vars:
        PACKAGE_NAME: br.app.soneca
      node: 22
      java: 21
    scripts:
      - name: Instalar dependências
        script: npm ci
      - name: Montar o site e atualizar o projeto do Android
        script: npm run android
      - name: Compilar
        script: |
          # Número da compilação: um a mais que o último na Play Store (enquanto não houver ligação com a
          # Play Store, o número da compilação do Codemagic, que só cresce).
          LATEST=$(google-play get-latest-build-number --package-name "$PACKAGE_NAME" 2>/dev/null || echo "$BUILD_NUMBER")
          cd android && chmod +x gradlew && ./gradlew bundleRelease -PversionCode=$((LATEST + 1))
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
